# Amount of temporal jitter to apply to frame selections.
max_frame_jitter: 0
# Whether to enable multi-camera training. Otherwise, it will use
# vanilla SimCLR.
enable_multi_view: true
# Limit training to these specific views.
filter_views: null
# Select this many views for each example.
num_views: 1
# Add this many extra temporal views for each example.
num_temporal_views: 1
# Minimum and maximum number of frames to step forward in time for generating
# additional views.
temporal_step_range: [15, 15]
# Number of examples to use from the dataset.
downsample_size: 192000
