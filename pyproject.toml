[tool.poetry]
name = "self_supervised"
version = "0.1.0"
description = "Multi-object tracking for cotton flowers."
authors = ["Daniel Petti <djpetti@gmail.com>"]
license = "MIT"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
priority = "supplemental"

[tool.poetry.dependencies]
python = "~3.10"
kedro = "^0.19.14"
pandas = "^2.3.0"
loguru = "^0.5.3"
seaborn = "^0.13.2"
matplotlib = "^3.3.4"
pydantic = "^2.9.2"
scipy = "^1.6.2"
opencv-contrib-python = "^4.5"
tqdm = "^4.64.0"
python-json-logger = "^2.0.4"
setuptools = "^65.7.0"
torch = {version = "^2.7.1", source = "pytorch"}
torchvision = "^0.22.1"
methodtools = "^0.4.5"
wandb = "^0.20.1"
torchmetrics = "^0.11.0"
scikit-learn = "^1.2.1"
segment-anything = {git = "https://github.com/facebookresearch/segment-anything.git"}
pyyaml = "^6"
ultralytics = { path = "external/ultralytics", develop = false }
mallard_client = { path = "external/mallard_client", develop = false }
requests = "^2.32.3"
universal-pathlib = "^0.2.5"
fief-client = "^0.20.0"
requests-toolbelt = "^1.0.0"
yaspin = "^3.1.0"
shapely = "^2.0.6"
pyrr = "^0.10.3"
opencv-python = "^4.11.0.86"
kedro-datasets = "^7.0.0"
pyarrow = "^20.0.0"
openpyxl = "^3.1.5"

[tool.poetry.dev-dependencies]
pytest = "^6.2.2"
pytest-mock = "^3.5.1"
pytest-black = "^0.3.12"
black = "^22.3.0"
isort = "^5.7.0"
pre-commit = "^2.11.0"
pytest-snapshot = "^0.5.0"
Faker = "^6.6.2"
pytest-coverage = "^0.0"
pytest-flake8 = "^1.0.7"
pydot = "^1.4.2"
jupyterlab = "^3.4.2"

[tool.poetry.group.dev.dependencies]
statsmodels = "^0.14.4"
numpy = "^2.2.6"

[tool.black]
line-length = 79
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.venv
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 79
skip = "('.eggs', '.git', '.venv', 'build', 'dist')"

[tool.kedro]
package_name = "self_supervised"
project_name = "Self-Supervised Learning"
kedro_init_version = "0.19.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.kedro_telemetry]
project_id = "bceea18bd7f340a38d0c31fe14971674"
